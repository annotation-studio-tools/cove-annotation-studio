name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check behavior and syntax
        run: |
          node --test src/model.test.mjs src/exchange.test.mjs
          node --check src/studio.mjs
      - name: Build extension
        run: python build.py
      - name: Check packaged frontend
        run: node --check artifacts/studio.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: annotation-studio
          path: |
            artifacts/*.zip
            artifacts/*.sha256
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: annotation-studio
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.zip artifacts/*.sha256 --verify-tag --title "Annotation Studio $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
